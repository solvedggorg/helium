name: Nix package and release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Helium Linux AppImage version to package (e.g. 0.15.4.1)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nix-release-${{ github.ref }}
  cancel-in-progress: false

env:
  ORIGIN_REMOTE: git@github.com:solvedggorg/helium.git
  ORIGIN_HTTPS: https://github.com/solvedggorg/helium.git
  ORIGIN_REPO: solvedggorg/helium

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out solvedggorg/helium
        uses: actions/checkout@v4
        with:
          repository: solvedggorg/helium
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Point origin at solvedggorg/helium
        run: |
          git remote set-url origin "$ORIGIN_HTTPS"
          git remote -v

      - name: Resolve versions
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TREE_VERSION=$(python3 utils/helium_version.py --tree . --print)
          if [ -n "${INPUT_VERSION:-}" ]; then
            BIN_VERSION="$INPUT_VERSION"
          elif [ -n "${RELEASE_TAG:-}" ]; then
            BIN_VERSION="$RELEASE_TAG"
          else
            BIN_VERSION="$TREE_VERSION"
          fi
          echo "tree=$TREE_VERSION" >> "$GITHUB_OUTPUT"
          echo "bin=$BIN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch AppImages (this repo, else helium-linux)
        id: bins
        env:
          BIN_VERSION: ${{ steps.ver.outputs.bin }}
        run: |
          set -euo pipefail
          mkdir -p dist
          fetch() {
            local name="$1"
            local dest="dist/$name"
            local ours="https://github.com/${ORIGIN_REPO}/releases/download/${BIN_VERSION}/${name}"
            local upstream="https://github.com/imputnet/helium-linux/releases/download/${BIN_VERSION}/${name}"
            if curl -fsSL -o "$dest" "$ours"; then
              echo "fetched $name from ${ORIGIN_REPO}"
            elif curl -fsSL -o "$dest" "$upstream"; then
              echo "fetched $name from imputnet/helium-linux"
            else
              echo "::error::could not fetch $name for $BIN_VERSION"
              return 1
            fi
            sha256sum "$dest" | awk '{print $1}'
          }
          X86_HEX=$(fetch "helium-${BIN_VERSION}-x86_64.AppImage")
          ARM_HEX=$(fetch "helium-${BIN_VERSION}-arm64.AppImage")
          echo "x86_hex=$X86_HEX" >> "$GITHUB_OUTPUT"
          echo "arm_hex=$ARM_HEX" >> "$GITHUB_OUTPUT"

      - name: Write hashes.nix and standalone derivation
        env:
          BIN_VERSION: ${{ steps.ver.outputs.bin }}
          X86_HEX: ${{ steps.bins.outputs.x86_hex }}
          ARM_HEX: ${{ steps.bins.outputs.arm_hex }}
        run: |
          set -euo pipefail
          sri() { python3 -c "import base64,sys; print('sha256-'+base64.b64encode(bytes.fromhex(sys.argv[1])).decode())" "$1"; }
          X86_SRI=$(sri "$X86_HEX")
          ARM_SRI=$(sri "$ARM_HEX")
          cat > nix/hashes.nix <<EOF
          # Binary pins for the Nix package. Generated by nix-release.yml.
          {
            version = "${BIN_VERSION}";
            homepage = "https://github.com/solvedggorg/helium";
            binary = {
              owner = "solvedggorg";
              repo = "helium";
            };
            assets = {
              x86_64-linux = {
                name = "helium-${BIN_VERSION}-x86_64.AppImage";
                hash = "${X86_SRI}";
              };
              aarch64-linux = {
                name = "helium-${BIN_VERSION}-arm64.AppImage";
                hash = "${ARM_SRI}";
              };
            };
          }
          EOF
          cp nix/default.nix nix/flake.nix nix/hashes.nix dist/
          tar -C nix -czf dist/helium-nix.tar.gz default.nix flake.nix hashes.nix
          echo "wrote dist/helium-nix.tar.gz"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Instantiate derivation
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake show ./nix
          drv=$(nix-instantiate -E 'with import <nixpkgs> {}; callPackage ./nix/default.nix {}')
          echo "$drv" | tee dist/helium.drv
          cp -L "$drv" dist/helium.drv.store

      - name: Upload release assets
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repository: solvedggorg/helium
          tag_name: ${{ steps.ver.outputs.bin }}
          files: |
            dist/helium-${{ steps.ver.outputs.bin }}-x86_64.AppImage
            dist/helium-${{ steps.ver.outputs.bin }}-arm64.AppImage
            dist/default.nix
            dist/flake.nix
            dist/hashes.nix
            dist/helium.drv
            dist/helium.drv.store
            dist/helium-nix.tar.gz
          fail_on_unmatched_files: false

      - name: Commit hash pin if it changed
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        run: |
          set -euo pipefail
          git config user.name "helium-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/hashes.nix
          if git diff --cached --quiet; then
            echo "hashes.nix unchanged"
            exit 0
          fi
          git commit -m "nix: pin helium ${{ steps.ver.outputs.bin }}"
          git push origin HEAD:main
